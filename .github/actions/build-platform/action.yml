name: Build one platform
description: Build the image for one platform, push it by digest and upload the build metadata.

inputs:
  pg:
    description: PostgreSQL major version
    required: true
  oss:
    description: '"-oss" for the Apache-only image, empty for the full image'
    default: ""
  platform:
    description: Platform to build, for example linux/arm/v7
    required: true
  ts_version:
    description: TimescaleDB version, tag or branch to build
    required: true
  org:
    description: Docker Hub organization
    required: true
  dockerhub_username:
    description: Docker Hub user
    required: true
  dockerhub_token:
    description: Docker Hub access token
    required: true

runs:
  using: composite
  steps:
    # GitHub injects the Actions cache credentials into action steps only.
    # Re-export them to the job env so buildx in the make step can use the
    # gha cache backend.
    - name: Expose the Actions runtime for the buildx cache
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[name]) core.exportVariable(name, process.env[name]);
          }

    # Only arm/v6 and arm/v7 run under emulation. The other platforms build
    # on a native runner.
    - name: Set up QEMU
      if: startsWith(inputs.platform, 'linux/arm/')
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      with:
        platforms: all

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build and push
      id: build
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        slug="${PLATFORM//\//-}"
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        DOCKER_CACHE_SCOPE="pg${{ inputs.pg }}${{ inputs.oss }}-$slug" \
        make build-platform${{ inputs.oss }} ORG="${{ inputs.org }}" PG_VER="pg${{ inputs.pg }}" \
            TS_VERSION="${{ inputs.ts_version }}" PREV_EXTRA="${{ inputs.oss }}" PLATFORM="$PLATFORM"

    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digest_pg${{ inputs.pg }}${{ inputs.oss }}_${{ steps.build.outputs.slug }}
        path: digests/*
        if-no-files-found: error
        retention-days: 1
