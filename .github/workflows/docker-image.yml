name: Release Docker Image
on:
  push:
    branches: [ release_docker, dev-build ]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Version to release'
        type: string
        required: true
      registry:
        description: 'Registry to use to push images'
        type: string
        required: false
        default: 'dev'
      tag_latest:
        description: 'Tag the published images as latest'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      registry:
        description: 'Registry to use to push images'
        type: choice
        required: false
        default: 'dev'
        options:
        - prod
        - dev
      tag_latest:
        description: 'Tag the published images as latest'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG: ${{ github.event.inputs.registry == 'prod' && 'timescale' || 'timescaledev' }}
  # Beta releases are not tagged as latest. An empty BETA adds the latest tag.
  BETA: ${{ github.event.inputs.tag_latest != 'true' && '1' || '' }}
  TS_VERSION: ${{ github.event.inputs.version || '2.26.0' }}

jobs:

  # Build one platform per job and push it by digest. amd64 and arm64 build
  # on native runners. 386 runs natively on x64. arm/v6 and arm/v7 run under
  # QEMU on x64.
  build:
    name: PG${{ matrix.pg }}${{ matrix.oss }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
        oss: [ "", "-oss" ]
        platform: [ linux/amd64, linux/386, linux/arm64, linux/arm/v6, linux/arm/v7 ]
        include:
          - platform: linux/amd64
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
          - platform: linux/386
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
          - platform: linux/arm64
            runs_on: runs-on/fleet=linux-8cpu-ondemand/env=ue1
          - platform: linux/arm/v6
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
          - platform: linux/arm/v7
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-platform
        with:
          pg: ${{ matrix.pg }}
          oss: ${{ matrix.oss }}
          platform: ${{ matrix.platform }}
          ts_version: ${{ env.TS_VERSION }}
          org: ${{ env.ORG }}
          dockerhub_username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          dockerhub_token: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}

  # Tag the digests of all platforms as one multi-arch image.
  manifest:
    name: Manifest PG${{ matrix.pg }}${{ matrix.oss }}
    needs: [ build ]
    runs-on: runs-on/fleet=linux-2cpu-ondemand/env=ue1
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
        oss: [ "", "-oss" ]
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/publish-manifest
        with:
          pg: ${{ matrix.pg }}
          oss: ${{ matrix.oss }}
          ts_version: ${{ env.TS_VERSION }}
          org: ${{ env.ORG }}
          beta: ${{ env.BETA }}
          dockerhub_username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          dockerhub_token: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}
