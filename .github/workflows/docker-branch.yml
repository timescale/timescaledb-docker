# Workflow to build docker images for a specific branch
#
# You can use the GitHub CLI to trigger this workflow like so:
# gh workflow run docker-branch.yml -R timescale/timescaledb-docker -f branch=1-step-policy-alpha
#
# The built images will be uploaded to our timescaledev account on dockerhub.
# You can view them here: https://hub.docker.com/r/timescaledev/timescaledb/tags
#
name: Docker Image for specific branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch or tag to build'
        required: true

env:
  ORG: timescaledev
  TS_VERSION: ${{ github.event.inputs.branch }}

jobs:

  build:
    name: Docker ${{ github.event.inputs.branch }} PG${{ matrix.pg }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
        platform: [ linux/amd64 ]
        include:
          - platform: linux/amd64
            runs_on: runs-on/fleet=linux-8cpu-x64/env=ue1
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-platform
        with:
          pg: ${{ matrix.pg }}
          platform: ${{ matrix.platform }}
          ts_version: ${{ env.TS_VERSION }}
          org: ${{ env.ORG }}
          dockerhub_username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          dockerhub_token: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}

  manifest:
    name: Manifest ${{ github.event.inputs.branch }} PG${{ matrix.pg }}
    needs: [ build ]
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/publish-manifest
        with:
          pg: ${{ matrix.pg }}
          ts_version: ${{ env.TS_VERSION }}
          org: ${{ env.ORG }}
          tag: -t ${{ env.ORG }}/timescaledb:branch-${{ env.TS_VERSION }}-pg${{ matrix.pg }}
          dockerhub_username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          dockerhub_token: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}
